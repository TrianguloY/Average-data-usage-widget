plugins {
    id 'com.android.application'
    id 'com.github.triplet.play' version '4.1.1'
}

android {
    namespace 'com.trianguloy.continuousDataUsage'
    compileSdk 36
    defaultConfig {
        applicationId "com.trianguloy.continuousDataUsage"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 30
        versionName "4.2.1"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}


play {
    track.set("beta")
    releaseName.set(android.defaultConfig.versionName + " (" + android.defaultConfig.versionCode + ")")
}